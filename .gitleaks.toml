title = "IntentForm secret policy"

[extend]
# 继承 gitleaks 内置规则集（云厂商 Key、私钥、通用高熵串），再叠加项目自有规则。
useDefault = true

[[rules]]
id = "llm-api-key"
description = "OpenAI 兼容协议的 API Key（sk- 前缀）"
regex = '''\bsk-[A-Za-z0-9_-]{20,}\b'''
tags = ["key", "llm"]

[[rules]]
id = "llm-api-key-assignment"
description = "把 Key 直接写进赋值语句，例如 LLM_API_KEY=sk-..."
regex = '''(?i)(llm_api_key|openai_api_key|api_key)\s*[:=]\s*["']?[A-Za-z0-9_-]{24,}["']?'''
tags = ["key", "llm"]

[[rules]]
id = "cn-mobile"
description = "中国大陆手机号（评审要求：真实手机号不得入库）"
regex = '''(?<!\d)1[3-9]\d{9}(?!\d)'''
tags = ["pii"]

[[rules]]
id = "cn-id-card"
description = "中国大陆身份证号"
regex = '''(?<!\d)\d{17}[\dXx](?!\d)'''
tags = ["pii"]

[allowlist]
description = "模板文件与回放样本允许出现变量名占位，但不允许出现真实值"
paths = [
  '''(^|/)\.env\.example$''',
  '''(^|/)fixtures/replays/''',
  '''(^|/)docs/prompt-log/''',
]
# ${VAR} 形式的占位与显式占位词不算泄露
regexes = [
  '''\$\{[A-Z0-9_]+\}''',
  '''(?i)(your|example|placeholder|changeme|replace)[-_ ]?(api[-_]?key|token|secret)''',
]
