packages:
  - packages/*
  - server
  - web

# esbuild（vitest 传递依赖）的 postinstall 需要下载平台二进制。
# pnpm 10+ 默认拦截依赖构建脚本，这里显式放行这一项；新增依赖若需要构建脚本，
# 必须在本文件登记并说明理由，禁止 `allowBuilds: {}` 或全量放行。
allowBuilds:
  # better-sqlite3 13.x 自带 8 个 NAPI 预编译（prebuilds/win32-x64.node 等），运行时由
  # lib/*.js 直接加载，不需要 node-gyp 编译。故置为 false，避免 pnpm 对该包触发隐式
  # node-gyp rebuild（否则全新安装要求机器上同时有 Python 与 Visual Studio）。
  # 选它而不是 node:sqlite 是为了不依赖 Node 22+ 的实验 API（详见《计划 v3.1》§5）。
  better-sqlite3: false
  esbuild: true
