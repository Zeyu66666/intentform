packages:
  - packages/*
  - server
  - web

# esbuild（vitest 传递依赖）的 postinstall 需要下载平台二进制。
# pnpm 10+ 默认拦截依赖构建脚本，这里显式放行这一项；新增依赖若需要构建脚本，
# 必须在本文件登记并说明理由，禁止 `allowBuilds: {}` 或全量放行。
allowBuilds:
  # better-sqlite3 是原生模块：postinstall 负责编译/下载绑定，不放行则 require 时报找不到 .node。
  # 选它而不是 node:sqlite 是为了不依赖 Node 22+ 的实验 API（详见《计划 v3.0》§5）。
  better-sqlite3: true
  esbuild: true
