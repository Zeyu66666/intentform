name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 关键：CI 全程用回放模式。它同时证明两件事——
  # 1) 没有 API Key 也能跑通全套测试（评委复现路径同此）；
  # 2) 测试不会因为上游模型抖动而变红。
  LLM_MODE: replay
  LLM_REPLAY_SPEED: instant

jobs:
  verify:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # 计划 v1.1 §3.1 与风险 6：原生模块（better-sqlite3、@node-rs/argon2）在评委的
      # Windows 机器上最容易装不上。矩阵里放 Windows，是为了在 I4 引入它们之前就把
      # 这条路先跑通，而不是等到 10/31 复现时才暴露。
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖（严格按 lockfile）
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test（无 Key 回放）
        run: pnpm test

      - name: 密钥与个人信息扫描（工作区）
        run: node scripts/secret-scan.mjs

      - name: 密钥与个人信息扫描（全历史）
        run: node scripts/secret-scan.mjs --history

  secrets:
    name: gitleaks（全历史）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与本地钩子同语义的第二道闸：本地可被 --no-verify 绕过，CI 不行。
      # 计划 §I0 的退出标准就是 `gitleaks detect` 为 0。
      # 个人开源仓库用 GITHUB_TOKEN 即可；组织账号需配 GITLEAKS_LICENSE。
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
