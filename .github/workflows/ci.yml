name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint / typecheck / test (replay 模式)
    runs-on: ubuntu-latest
    env:
      # 关键：CI 全程用回放模式。它同时证明两件事——
      # 1) 没有 API Key 也能跑通全套测试（评委复现路径同此）；
      # 2) 测试不会因为上游模型抖动而变红。
      LLM_MODE: replay
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖（严格按 lockfile）
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test（无 Key 回放）
        run: pnpm test

      - name: 密钥与个人信息扫描（工作区）
        run: node scripts/secret-scan.mjs

      - name: 密钥与个人信息扫描（全历史）
        run: node scripts/secret-scan.mjs --history

  secrets:
    name: gitleaks（全历史）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 与本地钩子同语义的第二道闸：本地可被 --no-verify 绕过，CI 不行。
      # 个人开源仓库用 GITHUB_TOKEN 即可；组织账号需配 GITLEAKS_LICENSE。
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
